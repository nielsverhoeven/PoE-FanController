name: Hardware Check (ERC + DRC)

on:
  push:
    paths:
      - 'hardware/**'
      - '.github/workflows/hardware-check.yml'
  pull_request:
    paths:
      - 'hardware/**'
      - '.github/workflows/hardware-check.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-generator:
    name: Validate PCB Generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        run: pip install --quiet sexpdata 2>/dev/null || true

      - name: Syntax check generator
        run: python -m py_compile hardware/generate_project.py && echo "Syntax OK"

  kicad-erc-drc:
    name: KiCad ERC + DRC
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: kicad/kicad:10.0.2
      options: --user root
      # KiCad locked to 10.0.3 per P-KI-01; using 10.0.2 (closest available on Docker Hub as of 2026-05-09)

    steps:
      - uses: actions/checkout@v4

      - name: Run PCB generator
        run: |
          cd hardware
          KICAD_FP_BASE=/usr/share/kicad/footprints python3 generate_project.py

      - name: Run ERC
        run: |
          kicad-cli sch erc \
            hardware/kicad/PoE-FanController.kicad_sch \
            --output hardware/kicad/erc_output.json \
            --format json --exit-code-violations

      - name: Check ERC results (zero errors enforced)
        run: |
          python3 -c "
          import json, sys
          d = json.load(open('hardware/kicad/erc_output.json'))
          errs = [v for s in d.get('sheets', []) for v in s.get('violations', []) if v.get('severity') == 'error']
          print(f'ERC: {len(errs)} error(s)')
          sys.exit(1 if errs else 0)
          "

      - name: Run DRC
        run: |
          kicad-cli pcb drc \
            hardware/kicad/PoE-FanController.kicad_pcb \
            --output hardware/kicad/drc_output.json \
            --format json --exit-code-violations || true

      - name: Check DRC violation count (baseline 36)
        # DRC baseline: 36 pre-existing violations (solder_mask_bridge, silk_edge_clearance,
        # lib_footprint_mismatch). See issue #39 to drive to zero.
        run: |
          python3 -c "
          import json, sys
          d = json.load(open('hardware/kicad/drc_output.json'))
          violations = d.get('violations', [])
          n = len(violations)
          print(f'DRC: {n} violation(s)')
          sys.exit(1 if n > 36 else 0)
          "

      - name: Upload ERC report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erc-report
          path: hardware/kicad/erc_output.json

      - name: Upload DRC report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drc-report
          path: hardware/kicad/drc_output.json

