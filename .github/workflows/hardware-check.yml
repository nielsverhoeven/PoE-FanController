name: Hardware Check (ERC + DRC)

on:
  push:
    paths:
      - 'hardware/**'
  pull_request:
    paths:
      - 'hardware/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-generator:
    name: Validate PCB Generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Syntax check
        run: python -m py_compile hardware/generate_project.py

      - name: Run generator (footprint embed will be skipped on CI; checks logic)
        # KICAD_FP_BASE points to a path that does not exist on the runner.
        # embed_footprint() will raise FileNotFoundError for each missing .kicad_mod.
        # We verify the script exits without import/syntax errors; footprint errors
        # are caught and reported but do not block this gate.
        run: python hardware/generate_project.py 2>&1 || true

  kicad-erc-drc:
    name: KiCad ERC + DRC
    runs-on: ubuntu-latest
    # KiCad 10 .kicad_sch / .kicad_pcb format (version 20260101 / 20260206).
    # kicad-cli from the nightly dev PPA is required to parse these files.
    # If the PPA is unavailable the job exits 0 with a skip notice so that
    # PRs are not permanently blocked while KiCad 10 lands in apt stable.
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad (nightly, for KiCad 10 file format support)
        id: install_kicad
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-dev 2>/dev/null \
            || { echo "kicad_available=false" >> "$GITHUB_OUTPUT"; exit 0; }
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends kicad \
            && echo "kicad_available=true" >> "$GITHUB_OUTPUT" \
            || echo "kicad_available=false" >> "$GITHUB_OUTPUT"

      - name: Skip notice (KiCad unavailable)
        if: steps.install_kicad.outputs.kicad_available != 'true'
        run: |
          echo "⚠️  KiCad dev PPA unavailable on this runner."
          echo "    ERC/DRC skipped — recheck when kicad-10 lands in apt stable."

      - name: Run PCB generator
        if: steps.install_kicad.outputs.kicad_available == 'true'
        env:
          KICAD_FP_BASE: /usr/share/kicad/footprints
        run: python3 hardware/generate_project.py

      - name: Run ERC
        if: steps.install_kicad.outputs.kicad_available == 'true'
        run: |
          kicad-cli sch erc \
            hardware/kicad/PoE-FanController.kicad_sch \
            --output hardware/kicad/erc_result.rpt
          echo "=== ERC Report ===" && cat hardware/kicad/erc_result.rpt

      - name: Run DRC
        if: steps.install_kicad.outputs.kicad_available == 'true'
        run: |
          kicad-cli pcb drc \
            hardware/kicad/PoE-FanController.kicad_pcb \
            --output hardware/kicad/drc_result.rpt \
            --schematic-parity
          echo "=== DRC Report ===" && cat hardware/kicad/drc_result.rpt

      - name: Check DRC violation count
        if: steps.install_kicad.outputs.kicad_available == 'true'
        run: |
          VIOLATIONS=$(grep -c '^\[' hardware/kicad/drc_result.rpt || true)
          MISSING=$(grep -c 'missing_footprint' hardware/kicad/drc_result.rpt || true)
          echo "Total DRC violations: $VIOLATIONS"
          echo "missing_footprint:    $MISSING"
          if [ "$MISSING" -gt 0 ]; then
            echo "❌ FAIL: missing_footprint violations detected"
            exit 1
          fi
          if [ "$VIOLATIONS" -gt 36 ]; then
            echo "❌ FAIL: DRC violation count $VIOLATIONS exceeds threshold 36"
            exit 1
          fi
          echo "✅ PASS: DRC within acceptable limits"

      - name: Upload ERC report
        uses: actions/upload-artifact@v4
        if: steps.install_kicad.outputs.kicad_available == 'true'
        with:
          name: erc-report
          path: hardware/kicad/erc_result.rpt

      - name: Upload DRC report
        uses: actions/upload-artifact@v4
        if: steps.install_kicad.outputs.kicad_available == 'true'
        with:
          name: drc-report
          path: hardware/kicad/drc_result.rpt

