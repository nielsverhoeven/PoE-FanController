name: Hardware Check (ERC + DRC)

on:
  pull_request:
    paths:
      - 'hardware/**'
      - '.github/workflows/hardware-check.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-generator:
    name: Validate PCB Generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        run: pip install --quiet sexpdata 2>/dev/null || true

      - name: Syntax check generator (entry point + all modules)
        run: |
          python -m py_compile hardware/generate_project.py
          python -m py_compile hardware/generator/__init__.py
          python -m py_compile hardware/generator/utils.py
          python -m py_compile hardware/generator/schematic.py
          python -m py_compile hardware/generator/components.py
          python -m py_compile hardware/generator/pcb_utils.py
          python -m py_compile hardware/generator/bom.py
          echo "Syntax OK — all 7 modules"

  kicad-erc-drc:
    name: KiCad ERC + DRC
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: kicad/kicad:10.0.2
      options: --user root
      # KiCad locked to 10.0.3 per P-KI-01; using 10.0.2 (closest available on Docker Hub as of 2026-05-09)

    steps:
      - uses: actions/checkout@v4

      - name: Store PCB checksum (P-KI-07 guard baseline)
        run: sha256sum hardware/kicad/PoE-FanController.kicad_pcb > /tmp/pcb_before.sha256

      - name: Regenerate schematic from Python
        run: |
          cd hardware
          KICAD_FP_BASE=/usr/share/kicad/footprints python3 generate_project.py

      - name: Guard — kicad_pcb must not be modified by generator (P-KI-07)
        run: |
          sha256sum --check /tmp/pcb_before.sha256 || \
            (echo "ERROR: kicad_pcb was modified by generator — P-KI-07 violation" && exit 1)

      - name: Run ERC
        run: |
          kicad-cli sch erc \
            hardware/kicad/PoE-FanController.kicad_sch \
            --output hardware/kicad/erc_output.json \
            --format json || true
          # Violations include warnings — zero-error gate enforced by the next step

      - name: Check ERC results (zero errors enforced)
        run: |
          python3 -c "
          import json, sys
          d = json.load(open('hardware/kicad/erc_output.json'))
          errs = [v for s in d.get('sheets', []) for v in s.get('violations', []) if v.get('severity') == 'error']
          print(f'ERC: {len(errs)} error(s)')
          sys.exit(1 if errs else 0)
          "

      - name: Run DRC
        run: |
          kicad-cli pcb drc \
            hardware/kicad/PoE-FanController.kicad_pcb \
            --output hardware/kicad/drc_output.json \
            --format json --exit-code-violations || true

      - name: Check DRC violation count (baseline 0)
        # Gate: zero severity=error DRC violations (excluding unconnected items).
        # Unconnected items are expected until PCB routing is complete (Issue #75).
        # Silk warnings are cosmetic and do not block merge.
        # Note: KiCad 10.0.2 (Docker) may include unconnected_items inside the
        # violations[] array; we filter by type so the gate is version-stable.
        # History: v1.0=67, v1.3.0=76, v2.0.0=75, v2.0.1=32, v3.0.0=0, v3.1.0=0 errors
        run: |
          python3 -c "
          import json, sys
          d = json.load(open('hardware/kicad/drc_output.json'))
          all_violations = d.get('violations', [])
          unconnected    = d.get('unconnected_items', [])
          footprint_errs = d.get('footprint_errors', [])
          # Errors: severity=error AND not an unconnected_items type violation
          errors   = [v for v in all_violations
                      if v.get('severity') == 'error'
                      and v.get('type', '') != 'unconnected_items']
          warnings = [v for v in all_violations if v.get('severity') == 'warning']
          # Also count unconnected from violations[] (KiCad 10.0.2 format)
          unconn_in_v = [v for v in all_violations if v.get('type','') == 'unconnected_items']
          total_unconn = len(unconnected) + len(unconn_in_v)
          print(f'DRC: {len(errors)} error(s), {len(warnings)} warning(s), {total_unconn} unconnected (routing pending)')
          if errors:
              for e in errors:
                  print(f'  ERROR [{e.get(\"type\",\"?\")}]: {e.get(\"description\",\"\")}')
          sys.exit(1 if errors else 0)
          "

      - name: Upload ERC report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erc-report
          path: hardware/kicad/erc_output.json

      - name: Upload DRC report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drc-report
          path: hardware/kicad/drc_output.json

