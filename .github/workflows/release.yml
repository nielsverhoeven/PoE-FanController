name: KiCad Hardware Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Build and publish hardware release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: kicad/kicad:10.0.2
      # KiCad locked to 10.0.3 per P-KI-01; using 10.0.2 (closest available on Docker Hub as of 2026-05-09)

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate KiCad files
        run: |
          cd hardware
          KICAD_FP_BASE=/usr/share/kicad/footprints python3 generate_project.py

      - name: DRC gate (zero tolerance) — P-CI-02
        run: |
          kicad-cli pcb drc \
            hardware/kicad/PoE-FanController.kicad_pcb \
            --output /tmp/drc_release.json \
            --format json --exit-code-violations || true
          python3 - <<'EOF'
          import json, sys
          d = json.load(open('/tmp/drc_release.json'))
          violations = d.get('violations', [])
          if violations:
              print(f"DRC FAILED: {len(violations)} violation(s) — Gerber export blocked (P-CI-02, P-TEST-04)")
              for v in violations[:10]:
                  print(f"  {v.get('type','?')}: {v.get('description','')}")
              sys.exit(1)
          print("DRC PASSED: 0 violations")
          EOF

      - name: Export Gerbers
        run: |
          mkdir -p hardware/gerbers
          kicad-cli pcb export gerbers \
            hardware/kicad/PoE-FanController.kicad_pcb \
            --output hardware/gerbers/

      - name: Export drill files
        run: |
          kicad-cli pcb export drill \
            hardware/kicad/PoE-FanController.kicad_pcb \
            --output hardware/gerbers/ \
            --format excellon

      - name: Export schematic PDF
        run: |
          kicad-cli sch export pdf \
            hardware/kicad/PoE-FanController.kicad_sch \
            --output hardware/PoE-FanController-schematic.pdf

      - name: Bundle release assets
        run: |
          TAG="${{ github.ref_name || inputs.tag }}"
          zip -j hardware/gerbers-${TAG}.zip hardware/gerbers/*
          cp hardware/bom/bom.csv hardware/PoE-FanController-bom-${TAG}.csv

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name || inputs.tag }}"
          gh release create "${TAG}" \
            --title "PoE FanController ${TAG}" \
            --notes "Hardware release ${TAG}. Contains Gerbers, drill files, BOM, and schematic PDF." \
            hardware/gerbers-${TAG}.zip \
            hardware/PoE-FanController-bom-${TAG}.csv \
            hardware/PoE-FanController-schematic.pdf

