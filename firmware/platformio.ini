; PoE FanController — PlatformIO configuration
; Target: ESP32-P4-MINI-1U-N16R8 (Espressif RISC-V, 16MB flash, 8MB PSRAM)
; Requires: espressif32 >= 6.9.0, arduino-esp32 >= 3.1.0
; Board: Custom manifest at boards/esp32-p4-mini-1u.json
;
; GPIO pin assignments — verified against ESP32-P4 TRM §EMAC (OQ-01 resolved):
;   RMII fixed pins: GPIO32-37 + GPIO50 (handled by ETH.begin(), no #define needed)
;   MDIO/MDC: GPIO28/31 (GPIO-matrix configurable)

[platformio]
default_envs = esp32-p4

; ---------------------------------------------------------------------------
; Native environment — host-side unit tests (no hardware required)
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    ; Pin constants for native tests (mirror esp32-p4 values)
    -DFAN1_PWM_PIN=4
    -DFAN2_PWM_PIN=5
    -DFAN3_PWM_PIN=6
    -DFAN4_PWM_PIN=7
    -DFAN1_TACH_PIN=8
    -DFAN2_TACH_PIN=9
    -DFAN3_TACH_PIN=10
    -DFAN4_TACH_PIN=11
    -DNTC_ADC_PIN=16
    -DSTATUS_LED_PIN=2
    -DBOOT_PIN=0
    -DETH_MDC_PIN=31
    -DETH_MDIO_PIN=28
test_filter = test_pins test_ota test_fan

; ---------------------------------------------------------------------------
; ESP32-P4 target environment
; ---------------------------------------------------------------------------
[env:esp32-p4]
platform  = espressif32 @ >=6.9.0
board     = esp32-p4-mini-1u
board_dir = boards
framework = arduino

; arduino-esp32 >= 3.1.0 required for ESP32-P4 + ETH.h RMII support
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.1.0

; IDF 5.x-compatible async libraries (OQ-05: verify on target hardware)
lib_deps =
    mathieucarbou/ESPAsyncWebServer @ ^3.0.0
    mathieucarbou/AsyncTCP @ ^3.0.0

build_flags =
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    ; Fan PWM outputs — LEDC (25 kHz, 8-bit, arduino-esp32 3.x API)
    -DFAN1_PWM_PIN=4
    -DFAN2_PWM_PIN=5
    -DFAN3_PWM_PIN=6
    -DFAN4_PWM_PIN=7
    ; Fan tachometer inputs — GPIO interrupt
    -DFAN1_TACH_PIN=8
    -DFAN2_TACH_PIN=9
    -DFAN3_TACH_PIN=10
    -DFAN4_TACH_PIN=11
    ; Temperature / ADC
    -DNTC_ADC_PIN=16
    ; Status / control
    -DSTATUS_LED_PIN=2
    -DBOOT_PIN=0
    ; Ethernet MDIO/MDC (GPIO-matrix configurable; RMII fixed pins handled by ETH.begin)
    -DETH_MDC_PIN=31
    -DETH_MDIO_PIN=28
    ; ETH.h config for LAN8720A on RMII with 50 MHz clock from GPIO50
    -DETH_PHY_TYPE=ETH_PHY_LAN8720
    -DETH_PHY_ADDR=0
    -DETH_PHY_MDC=31
    -DETH_PHY_MDIO=28
    -DETH_CLK_MODE=ETH_CLOCK_GPIO50_OUT
    ; NOTE: RMII fixed pins GPIO32-37 + GPIO50 are assigned automatically by
    ;       ETH.begin() via IO_MUX and do NOT need separate #define constants.
    ;       See: ESP32-P4 TRM §EMAC "EMAC Signal Overview" (OQ-01 resolved).
