; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-p4-eth

[env:native]
platform = native
build_flags =
    ; C++11 required for nullptr, override GCC 5.x default (C++98) on MinGW32 native
    -std=c++11
    ; Pin constants for native tests (mirror esp32-p4 values)
    -DFAN1_PWM_PIN=21
    -DFAN2_PWM_PIN=23
    -DFAN3_PWM_PIN=46
    -DFAN4_PWM_PIN=48
    -DFAN1_TACH_PIN=20
    -DFAN2_TACH_PIN=22
    -DFAN3_TACH_PIN=33
    -DFAN4_TACH_PIN=47
    -DDHT11_DATA_PIN=16
    -DSTATUS_LED_PIN=2
    -DPROG_LED_PIN=15
    -DBOOT_PIN=0
    -DETH_MDC_PIN=31
    -DETH_MDIO_PIN=52
    -DETH_PHY_RST_PIN=51
    -DDS18B20_DATA_PIN=19
    -DPROBE_LED_PIN=20
test_filter = test_pins test_ota test_fan test_probe
platform_packages = platformio/toolchain-gccmingw32@^1.50100.0

[env:esp32-p4-eth]
platform = espressif32 @ >=6.9.0
board = waveshare-esp32-p4-eth
board_dir = boards
framework = arduino
platform_packages = 
	framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.1.0
lib_deps = 
	mathieucarbou/ESPAsyncWebServer @ ^3.0.0
	mathieucarbou/AsyncTCP @ ^3.0.0
	paulstoffregen/OneWire @ ^2.3.8
	milesburton/DallasTemperature @ ^3.11.0
	adafruit/DHT sensor library @ ^1.4.6
build_flags = 
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM
	-DFAN1_PWM_PIN=21
	-DFAN2_PWM_PIN=23
	-DFAN3_PWM_PIN=46
	-DFAN4_PWM_PIN=48
	-DFAN1_TACH_PIN=20
	-DFAN2_TACH_PIN=22
	-DFAN3_TACH_PIN=33
	-DFAN4_TACH_PIN=47
	-DDHT11_DATA_PIN=16
	-DSTATUS_LED_PIN=2
	-DBOOT_PIN=0
	-DETH_MDC_PIN=31
	-DETH_MDIO_PIN=52
	-DETH_PHY_RST_PIN=51
	-DETH_PHY_TYPE=ETH_PHY_LAN8720
	-DETH_PHY_ADDR=1
	-DETH_PHY_MDC=31
	-DETH_PHY_MDIO=52
	-DETH_PHY_RST=51
	-DETH_CLK_MODE=ETH_CLOCK_GPIO50_OUT
	-DDS18B20_DATA_PIN=19
	-DPROBE_LED_PIN=20
