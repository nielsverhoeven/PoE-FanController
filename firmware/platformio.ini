; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-p4

[env:native]
platform = native
build_flags =
    ; C++11 required for nullptr, override GCC 5.x default (C++98) on MinGW32 native
    -std=c++11
    ; Pin constants for native tests (mirror esp32-p4 values)
    -DFAN1_PWM_PIN=4
    -DFAN2_PWM_PIN=5
    -DFAN3_PWM_PIN=6
    -DFAN4_PWM_PIN=7
    -DFAN1_TACH_PIN=8
    -DFAN2_TACH_PIN=9
    -DFAN3_TACH_PIN=10
    -DFAN4_TACH_PIN=11
    -DNTC_ADC_PIN=16
    -DSTATUS_LED_PIN=2
    -DBOOT_PIN=0
    -DETH_MDC_PIN=31
    -DETH_MDIO_PIN=28
test_filter = test_pins test_ota test_fan
platform_packages = platformio/toolchain-gccmingw32@^1.50100.0

[env:esp32-p4]
platform = espressif32 @ >=6.9.0
board = esp32-p4-mini-1u
board_dir = boards
framework = arduino
platform_packages = 
	framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.1.0
	platformio/toolchain-gccmingw32@^1.50100.0
lib_deps = 
	mathieucarbou/ESPAsyncWebServer @ ^3.0.0
	mathieucarbou/AsyncTCP @ ^3.0.0
build_flags = 
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM
	-DFAN1_PWM_PIN=4
	-DFAN2_PWM_PIN=5
	-DFAN3_PWM_PIN=6
	-DFAN4_PWM_PIN=7
	-DFAN1_TACH_PIN=8
	-DFAN2_TACH_PIN=9
	-DFAN3_TACH_PIN=10
	-DFAN4_TACH_PIN=11
	-DNTC_ADC_PIN=16
	-DSTATUS_LED_PIN=2
	-DBOOT_PIN=0
	-DETH_MDC_PIN=31
	-DETH_MDIO_PIN=28
	-DETH_PHY_TYPE=ETH_PHY_LAN8720
	-DETH_PHY_ADDR=0
	-DETH_PHY_MDC=31
	-DETH_PHY_MDIO=28
	-DETH_CLK_MODE=ETH_CLOCK_GPIO50_OUT
